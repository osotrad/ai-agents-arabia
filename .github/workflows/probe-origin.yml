name: Probe origin allowlist

# Reports whether each Origin is allowed to call /api/mcp.
#
# The route checks auth BEFORE origin, so an invalid token yields 401 for
# every origin and reveals nothing. This therefore uses the real agent key:
#   200 = origin accepted
#   403 = origin rejected by the allowlist
# The key is only ever sent as a header and is never echoed.

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to test (scheme included)"
        default: "https://wokala.vip"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        env:
          HOST: ${{ inputs.host }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          set -uo pipefail
          test -n "$AGENT_API_KEY" || { echo "::error::AGENT_API_KEY unset"; exit 1; }
          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"probe","version":"1"}}}'
          for origin in \
            "$HOST" \
            "https://www.wokala.vip" \
            "https://ai-agents-arabia.osotrad101.workers.dev" \
            "http://localhost:3000" \
            "https://evil.example" \
          ; do
            code=$(curl -sS -m 40 -o /dev/null -w '%{http_code}' -X POST "$HOST/api/mcp" \
              -H "Authorization: Bearer $AGENT_API_KEY" \
              -H "Origin: $origin" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              --data "$body" 2>/dev/null || echo "000")
            case "$code" in
              200) verdict="ACCEPTED" ;;
              401) verdict="auth failed (key rejected)" ;;
              403) verdict="BLOCKED  <-- not in EXTRA_ORIGINS" ;;
              000) verdict="unreachable / no response" ;;
              *)   verdict="unexpected" ;;
            esac
            printf "  %-52s HTTP %-4s %s\n" "$origin" "$code" "$verdict"
          done
