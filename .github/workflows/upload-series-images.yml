name: Upload series images

# One-shot asset pipeline for the LangChain series: push each diagram through
# the site's own /api/v1/images endpoint and emit the resulting public URLs as
# a workflow artifact.
#
# Why a workflow rather than a local script: the images endpoint lives on the
# Worker, and *.workers.dev is TLS-reset from developer machines. A runner can
# reach it. It also keeps base64 payloads off `gh workflow run -f`, which caps
# input size well below the 259 KB agent_workflow.png.
#
# The bytes come from content/langchain/images/, committed to the repo, and are
# sha256-pinned in content/langchain/images.json. Runners have no SVG
# rasterizer and langchain-ai/docs may reorganise its image paths, so fetching
# upstream here would be neither reproducible nor verifiable offline.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify bytes against the manifest, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify bytes against manifest
        run: |
          set -euo pipefail
          n=0
          while IFS=$'\t' read -r path sha; do
            [ -z "$path" ] && continue
            got=$(sha256sum "$path" | cut -d' ' -f1)
            if [ "$got" != "$sha" ]; then
              echo "::error::sha256 drift for $path (want $sha got $got)"
              exit 1
            fi
            echo "  ok $path"
            n=$((n+1))
          done < <(jq -r '.images[] | [.path, .sha256] | @tsv' content/langchain/images.json)
          echo "  $n diagram(s) verified"

      - name: Upload via the site API
        if: ${{ !inputs.dry_run }}
        env:
          SITE: ${{ vars.SITE_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$SITE" || { echo "::error::SITE_URL unset"; exit 1; }
          test -n "$AGENT_API_KEY" || { echo "::error::AGENT_API_KEY unset"; exit 1; }
          echo '[]' > build_uploaded.json
          while IFS=$'\t' read -r slug path alt ctype; do
            [ -z "$slug" ] && continue
            b64=$(base64 -w0 "$path")
            payload=$(jq -n --arg s "$slug" --arg b "$b64" --arg a "$alt" --arg c "$ctype" \
              '{slug:$s, dataBase64:$b, alt:$a, contentType:$c}')
            resp=$(curl -sS -m 180 -X POST "$SITE/api/v1/images" \
              -H "Authorization: Bearer $AGENT_API_KEY" \
              -H 'Content-Type: application/json' --data "$payload")
            if [ "$(printf '%s' "$resp" | jq -r '.ok // false')" != "true" ]; then
              echo "::error::upload failed for $slug: $resp"
              exit 1
            fi
            url=$(printf '%s' "$resp" | jq -r '.image.url')
            key=$(printf '%s' "$resp" | jq -r '.image.key')
            echo "  $slug -> $key"
            jq --arg s "$slug" --arg u "$url" --arg k "$key" --arg a "$alt" \
              '. + [{slug:$s, imageUrl:$u, key:$k, imageAlt:$a}]' build_uploaded.json \
              > tmp.json && mv tmp.json build_uploaded.json
          done < <(jq -r '.images[] | [.slug, .path, .alt, .contentType] | @tsv' content/langchain/images.json)
          echo "--- uploaded ---"
          jq -r '.[] | "\(.slug)\t\(.imageUrl)"' build_uploaded.json

      - name: Publish artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: series-image-urls
          path: build_uploaded.json
