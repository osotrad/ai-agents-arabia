name: Check performance

# Repeatable timing against the live site, from a runner. Every content route
# is force-dynamic, so these numbers are real database round-trips each hit —
# there is no cache to hide behind, and a regression here is a real one.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base URL"
        default: "https://www.wokala.vip"

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Timing
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -uo pipefail
          printf "  %-46s %8s %8s %8s\n" "path" "ttfb" "total" "size"
          # One warm-up hit first: every content route is force-dynamic, so the
          # first request pays connection setup that no repeat visitor sees.
          for p in / /news /topics /topics/n8n /glossary /contact \
                   /news/n8n-three-agents-explained \
                   /news/langchain-langgraph-arabic-guide \
                   /feed.xml /sitemap.xml /llms.txt ; do
            curl -sS -m 45 -o /dev/null "$BASE$p" 2>/dev/null || true
            ttfb=""; tot=""; siz=""
            for i in 1 2 3 4 5; do
              read -r t s d <<<"$(curl -sS -m 45 -o /dev/null \
                -w '%{time_starttransfer} %{time_total} %{size_download}' \
                "$BASE$p" 2>/dev/null || echo "0 0 0")"
              ttfb="$ttfb $t"; tot="$tot $s"; siz="$siz $d"
            done
            med() { echo "$1" | tr ' ' '\n' | grep -v '^$' | sort -g | sed -n '3p'; }
            printf "  %-44s %8ss %8ss %9sB\n" "$p" "$(med "$ttfb")" "$(med "$tot")" "$(med "$siz")"
          done
          exit 0
