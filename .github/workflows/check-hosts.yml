name: Check hosts

# Read-only: confirms which deployment answers on which host, so a move can be
# verified rather than assumed. Runs from a runner because *.workers.dev is
# TLS-reset from developer machines.

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          set -uo pipefail
          for h in \
            ai-agents-arabia.osotrad101.workers.dev \
            wokala.vip \
            www.wokala.vip \
            wokala.vercel.app ; do
            code=$(curl -sS -m 25 -o /dev/null -w '%{http_code}' "https://$h/news" 2>/dev/null || echo 000)
            srv=$(curl -sS -m 25 -o /dev/null -D - "https://$h/news" 2>/dev/null \
                  | grep -i '^server:' | tr -d '\r' | head -1 | cut -d' ' -f2- || true)
            echo "  $(printf '%-46s' "$h") HTTP ${code}  ${srv:-unreachable}"
          done
          exit 0
