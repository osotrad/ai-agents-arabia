name: Check mobile layout

# Renders real pages at a 390px viewport in headless Chrome and reports any
# element whose right edge exceeds the viewport.
#
# This is the only measurement that answers the actual question: an iOS/Android
# browser offers pinch-zoom-out when document.scrollWidth exceeds innerWidth.
# A CSS review cannot tell you which element caused it, and guessing produced
# a fix that measured clean while the symptom persisted.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base URL"
        default: "https://www.wokala.vip"
      width:
        description: "Viewport width in px"
        default: "390"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Render and measure
        env:
          BASE: ${{ inputs.base }}
          WIDTH: ${{ inputs.width }}
        run: |
          set -uo pipefail
          cat > probe.mjs <<'JS'
          import puppeteer from "puppeteer-core";
          import { execSync } from "node:child_process";

          const width = Number(process.env.WIDTH || 390);
          const chrome = execSync(
            "ls -d /opt/hostedtoolcache/chrome/*/chrome-linux64/chrome 2>/dev/null | tail -1",
          ).toString().trim();

          const browser = await puppeteer.launch({
            executablePath: chrome,
            args: ["--no-sandbox", "--disable-dev-shm-usage"],
          });
          const page = await browser.newPage();
          await page.setViewport({ width, height: 844, deviceScaleFactor: 2, isMobile: true });

          const paths = [
            "/", "/news", "/topics", "/topics/n8n", "/topics/langchain",
            "/glossary", "/contact", "/search?q=langchain",
            "/news/n8n-three-agents-explained",
            "/news/n8n-expressions-and-data",
            "/news/n8n-licensing-and-editions-honestly",
            "/news/langchain-langgraph-arabic-guide",
            "/news/build-your-first-langgraph-agent-end-to-end",
          ];
          let bad = 0;
          for (const p of paths) {
            const url = `${process.env.BASE}${p}`;
            try {
              await page.goto(url, { waitUntil: "networkidle2", timeout: 45000 });
            } catch {
              console.log(`  ${p.padEnd(46)} navigation failed`);
              bad++;
              continue;
            }
            const r = await page.evaluate(() => {
              const vw = document.documentElement.clientWidth;
              const offenders = [];
              for (const el of document.querySelectorAll("body *")) {
                const b = el.getBoundingClientRect();
                if (b.width === 0 || b.height === 0) continue;
                const style = getComputedStyle(el);
                if (style.position === "fixed") continue;
                // an element that scrolls internally is not page overflow
                if (style.overflowX === "auto" || style.overflowX === "scroll") continue;
                if (b.right > vw + 1 || b.left < -1) {
                  offenders.push({
                    tag: el.tagName.toLowerCase(),
                    cls: (el.className || "").toString().slice(0, 40),
                    right: Math.round(b.right),
                    left: Math.round(b.left),
                  });
                }
              }
              return {
                vw,
                scrollW: document.documentElement.scrollWidth,
                bodyScrollW: document.body.scrollWidth,
                offenders: offenders.slice(0, 4),
              };
            });
            const overflow = r.scrollW > r.vw + 1;
            const mark = overflow ? "OVERFLOW" : "ok";
            if (overflow) bad++;
            console.log(
              `  ${p.padEnd(46)} ${mark} vw=${r.vw} scrollW=${r.scrollW}`,
            );
            for (const o of r.offenders) {
              console.log(`      <${o.tag} class="${o.cls}"> right=${o.right} left=${o.left}`);
            }
          }
          await browser.close();
          console.log(`\n  pages overflowing at ${width}px: ${bad}/${paths.length}`);
          exit 0;
          JS
          npm i --silent --no-save puppeteer-core >/dev/null 2>&1
          node probe.mjs
          exit 0
