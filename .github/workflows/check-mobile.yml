name: Check mobile layout

# Renders real pages at a phone viewport in headless Chrome and reports any
# element whose right edge exceeds the viewport.
#
# This is the only measurement that answers the actual question: a mobile
# browser offers pinch-zoom-out when document.scrollWidth exceeds clientWidth.
# A CSS audit cannot tell you which element caused it, and guessing produced
# a fix that measured clean while the symptom persisted.
#
# The probe lives in the repo (scripts/mobile-probe.mjs) rather than inline.
# Embedding a Node script in a YAML heredoc costs three failed runs to indent
# it correctly, and makes the logic unrunnable outside CI.

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Base URL"
        default: "https://www.wokala.vip"
      width:
        description: "Viewport width in px"
        default: "390"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Install probe
        run: |
          set -euo pipefail
          mkdir -p /tmp/probe
          npm i --prefix /tmp/probe --silent puppeteer-core
          cp scripts/mobile-probe.mjs /tmp/probe/
      - name: Measure
        env:
          BASE: ${{ inputs.base }}
          WIDTH: ${{ inputs.width }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          cd /tmp/probe && node mobile-probe.mjs
