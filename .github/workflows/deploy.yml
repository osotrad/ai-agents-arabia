name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext)
        run: pnpm exec opennextjs-cloudflare build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Drizzle tracks applied migrations, so this is a no-op when the schema
          # is already current. It runs before the deploy so code can never ship
          # against a schema that is behind it (a fresh database otherwise only
          # fails later, at the first write, with 42P01).
          pnpm db:migrate

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          put() {
            if [ -n "${2:-}" ]; then
              printf '%s' "$2" | pnpm exec wrangler secret put "$1" >/dev/null
              echo "set secret: $1"
            else
              echo "skip (unset): $1"
            fi
          }
          put DATABASE_URL    "${{ secrets.DATABASE_URL }}"
          put AGENT_API_KEY   "${{ secrets.AGENT_API_KEY }}"
          put ADMIN_API_KEY   "${{ secrets.ADMIN_API_KEY }}"
          put INDEXNOW_KEY    "${{ secrets.INDEXNOW_KEY }}"
          put SITE_URL        "${{ vars.SITE_URL }}"
          # Neon Object Storage — article header images. Unset = uploads 503,
          # everything else keeps working.
          put NEON_STORAGE_ENDPOINT       "${{ vars.NEON_STORAGE_ENDPOINT }}"
          put NEON_STORAGE_REGION         "${{ vars.NEON_STORAGE_REGION }}"
          put IMAGE_BUCKET                "${{ vars.IMAGE_BUCKET }}"
          put IMAGE_PUBLIC_BASE           "${{ vars.IMAGE_PUBLIC_BASE }}"
          put MAX_IMAGE_BYTES             "${{ vars.MAX_IMAGE_BYTES }}"
          put NEON_STORAGE_ACCESS_KEY_ID  "${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}"
          put NEON_STORAGE_SECRET_ACCESS_KEY "${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}"
          # Rolling-24h publish ceiling. A repo variable, not a secret: it is
          # an editorial guardrail, not a credential. Left unset, the Worker
          # falls back to the schema default of 5.
          put DAILY_PUBLISH_CAP   "${{ vars.DAILY_PUBLISH_CAP }}"
          # Extra browser origins allowed to call /api/mcp. Required whenever the
          # site answers on more than one host — a browser-based MCP client on an
          # unlisted origin is refused with 403 even when the bearer token is valid.
          put EXTRA_ORIGINS       "${{ vars.EXTRA_ORIGINS }}"
          # Canonical origin for metadata/sitemap. Unset means SITE_URL is used.
          put CANONICAL_URL       "${{ vars.CANONICAL_URL }}"

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec opennextjs-cloudflare deploy | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+workers\.dev' /tmp/deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke check
        run: |
          URL="${{ vars.SITE_HOSTNAME }}"
          URL="${URL:-${{ steps.deploy.outputs.url }}}"
          echo "Checking -> $URL"
          [ -n "$URL" ] || { echo "no deploy URL found"; exit 1; }
          sleep 5
          curl -sf "$URL" | grep -q 'dir="rtl"'
          curl -sf "$URL/llms.txt" | grep -q 'ai-agents-arabia'

