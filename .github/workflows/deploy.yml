name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (OpenNext)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Smoke check
        run: |
          URL="${{ vars.SITE_HOSTNAME }}"
          if [ -z "$URL" ]; then
            URL=$(pnpm exec wrangler deployments list --name ai-agents-arabia --json 2>/dev/null \
              | grep -oE 'https://[a-z0-9.-]+workers\.dev' | head -1)
          fi
          echo "Checking -> $URL"
          [ -n "$URL" ] || { echo "no deploy URL found"; exit 1; }
          sleep 5
          curl -sf "$URL" | grep -q 'dir="rtl"'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
