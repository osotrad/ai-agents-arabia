ailed</text><path d="M 730 98 L 770.0 98 L 770.0 98 L 810 98" fill="none" stroke="#2a2f38" stroke-width="2" marker-end="url(#ah)"/><rect x="810" y="70" width="140" height="56" rx="6" fill="#f4f1ea" stroke="#2a2f38" stroke-width="2"/><text x="880.0" y="96.0" text-anchor="middle" direction="rtl" font-family="system-ui, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="16" font-weight="600" fill="#12151a">انتظر</text><text x="880.0" y="115.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="11" fill="#6b7280">Wait</text><path d="M 880 126 L 880.0 126 L 880.0 200 L 880 200" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#ah)"/><path d="M 880 200 L 627.5 200 L 627.5 200 L 375 200" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#ah)"/><path d="M 375 200 L 375.0 200 L 375.0 126 L 375 126" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#ah)"/><text x="375.0" y="155.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="12" fill="#a16207">أعد المحاولة</text><polygon points="484,260 646,260 660,288.0 646,316 484,316 470,288.0" fill="#fdf3e7" stroke="#a16207" stroke-width="2" stroke-dasharray="6 4"/><text x="565.0" y="286.0" text-anchor="middle" direction="rtl" font-family="system-ui, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="16" font-weight="600" fill="#12151a">معالجة الخطأ</text><text x="565.0" y="305.0" text-anchor="middle" font-family="system-ui, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="11" fill="#6b7280">Error Workflow</text><path d="M 600 126 L 582.5 126 L 582.5 260 L 565 260" fill="none" stroke="#a16207" stroke-width="2" marker-end="url(#ah)"/><rect x="740" y="260" width="200" height="56" rx="6" fill="#f4f1ea" stroke="#2a2f38" stroke-width="2"/><text x="840.0" y="286.0" text-anchor="middle" direction="rtl" font-family="system-ui, 'Segoe UI', Tahoma, Arial, sans-serif" font-size="16" font-weight="600" fill="#12151a">تنبيهك